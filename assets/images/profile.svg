<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" width="180" height="240" role="img" aria-label="头像占位图">
  <!-- 简历未提供照片：蓝色椭圆为占位头像。拿到照片后把 HTML 中 img 的 src 换成实际图片路径即可。 -->
  <defs>
    <linearGradient id="avatarBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1784ef"/>
      <stop offset="1" stop-color="#0a4fa8"/>
    </linearGradient>
    <clipPath id="oval"><ellipse cx="90" cy="120" rx="90" ry="120"/></clipPath>
  </defs>
  <g clip-path="url(#oval)">
    <rect width="180" height="240" fill="url(#avatarBg)"/>
    <circle cx="90" cy="94" r="34" fill="#eaf3ff"/>
    <path d="M18 240c0-44 32-76 72-76s72 32 72 76z" fill="#eaf3ff"/>
    <path d="M63 176l27 27 27-27 13 64H50z" fill="#16324f" opacity=".38"/>
    <path d="M90 203l-9 37h18z" fill="#16324f" opacity=".22"/>
  </g>
</svg>
